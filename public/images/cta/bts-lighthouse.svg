<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 320" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="lh-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="1" stop-color="#020617"/>
    </linearGradient>
  </defs>
  <rect width="480" height="320" fill="url(#lh-bg)"/>

  <!-- Chrome bar -->
  <rect width="480" height="28" fill="#020617"/>
  <circle cx="14" cy="14" r="5" fill="#ff5f56"/>
  <circle cx="30" cy="14" r="5" fill="#ffbd2e"/>
  <circle cx="46" cy="14" r="5" fill="#27c93f"/>
  <text x="240" y="18" font-family="ui-sans-serif" font-size="9" fill="#94a3b8" text-anchor="middle">DevTools · Lighthouse Report</text>

  <!-- Report title -->
  <text x="24" y="60" font-family="ui-sans-serif" font-size="11" font-weight="800" fill="#f8fafc">giattech.com</text>
  <text x="24" y="76" font-family="ui-sans-serif" font-size="8" fill="#64748b">Mobile · Simulated Slow 4G · Emulated device</text>

  <!-- Score rings — 4 across -->
  <g font-family="ui-sans-serif" font-weight="800">
    <!-- Perf 98 -->
    <g transform="translate(60 170)">
      <circle r="42" fill="none" stroke="#065f46" stroke-width="7"/>
      <circle r="42" fill="none" stroke="#22c55e" stroke-width="7"
        stroke-dasharray="264" stroke-dashoffset="5" transform="rotate(-90)"/>
      <text y="6" font-size="26" fill="#22c55e" text-anchor="middle">98</text>
      <text y="60" font-size="8" fill="#cbd5e1" text-anchor="middle">PERFORMANCE</text>
    </g>
    <!-- A11y 100 -->
    <g transform="translate(170 170)">
      <circle r="42" fill="none" stroke="#065f46" stroke-width="7"/>
      <circle r="42" fill="none" stroke="#22c55e" stroke-width="7"
        stroke-dasharray="264" stroke-dashoffset="0" transform="rotate(-90)"/>
      <text y="6" font-size="26" fill="#22c55e" text-anchor="middle">100</text>
      <text y="60" font-size="8" fill="#cbd5e1" text-anchor="middle">ACCESSIBILITY</text>
    </g>
    <!-- Best Prac 100 -->
    <g transform="translate(280 170)">
      <circle r="42" fill="none" stroke="#065f46" stroke-width="7"/>
      <circle r="42" fill="none" stroke="#22c55e" stroke-width="7"
        stroke-dasharray="264" stroke-dashoffset="0" transform="rotate(-90)"/>
      <text y="6" font-size="26" fill="#22c55e" text-anchor="middle">100</text>
      <text y="60" font-size="8" fill="#cbd5e1" text-anchor="middle">BEST PRACTICES</text>
    </g>
    <!-- SEO 100 -->
    <g transform="translate(390 170)">
      <circle r="42" fill="none" stroke="#065f46" stroke-width="7"/>
      <circle r="42" fill="none" stroke="#22c55e" stroke-width="7"
        stroke-dasharray="264" stroke-dashoffset="0" transform="rotate(-90)"/>
      <text y="6" font-size="26" fill="#22c55e" text-anchor="middle">100</text>
      <text y="60" font-size="8" fill="#cbd5e1" text-anchor="middle">SEO</text>
    </g>
  </g>

  <!-- Metrics summary -->
  <g font-family="ui-sans-serif" font-size="9">
    <rect x="24" y="256" width="432" height="44" rx="8" fill="#0b1220" stroke="#1e293b"/>
    <g fill="#94a3b8">
      <text x="40" y="274">FCP</text>
      <text x="110" y="274">LCP</text>
      <text x="180" y="274">TBT</text>
      <text x="250" y="274">CLS</text>
      <text x="320" y="274">SI</text>
      <text x="390" y="274">TTI</text>
    </g>
    <g fill="#22c55e" font-weight="700" font-size="11">
      <text x="40" y="292">1.1s</text>
      <text x="110" y="292">1.6s</text>
      <text x="180" y="292">40ms</text>
      <text x="250" y="292">0.02</text>
      <text x="320" y="292">1.4s</text>
      <text x="390" y="292">1.9s</text>
    </g>
  </g>
</svg>
