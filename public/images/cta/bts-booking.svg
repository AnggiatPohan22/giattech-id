<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 320" preserveAspectRatio="xMidYMid slice">
  <rect width="480" height="320" fill="#faf7f2"/>

  <!-- Header -->
  <rect x="24" y="20" width="432" height="52" rx="12" fill="#ffffff" stroke="#e7dfd0"/>
  <text x="40" y="46" font-family="ui-sans-serif" font-size="14" font-weight="800" fill="#14120f">Villa Anantara — March 2026</text>
  <text x="40" y="62" font-family="ui-sans-serif" font-size="9" fill="#78716c">Channel: Airbnb · Booking.com · Direct</text>
  <rect x="376" y="30" width="64" height="30" rx="8" fill="#0f172a"/>
  <text x="408" y="49" font-family="ui-sans-serif" font-size="10" font-weight="700" fill="#ffffff" text-anchor="middle">+ Block</text>

  <!-- Weekday header -->
  <g font-family="ui-sans-serif" font-size="8" font-weight="700" fill="#78716c" text-anchor="middle">
    <text x="58" y="94">MON</text><text x="118" y="94">TUE</text><text x="178" y="94">WED</text>
    <text x="238" y="94">THU</text><text x="298" y="94">FRI</text><text x="358" y="94">SAT</text><text x="418" y="94">SUN</text>
  </g>

  <!-- Calendar grid — 4 rows x 7 cols, each cell 60x48 starting x=28, y=100 -->
  <g>
    <!-- Row 1 -->
    <rect x="28"  y="100" width="56" height="44" rx="6" fill="#ffffff" stroke="#e7dfd0"/>
    <rect x="88"  y="100" width="56" height="44" rx="6" fill="#ffffff" stroke="#e7dfd0"/>
    <rect x="148" y="100" width="56" height="44" rx="6" fill="#3b82f6"/>
    <rect x="208" y="100" width="56" height="44" rx="6" fill="#3b82f6"/>
    <rect x="268" y="100" width="56" height="44" rx="6" fill="#3b82f6"/>
    <rect x="328" y="100" width="56" height="44" rx="6" fill="#ffffff" stroke="#e7dfd0"/>
    <rect x="388" y="100" width="56" height="44" rx="6" fill="#ffffff" stroke="#e7dfd0"/>
    <!-- Row 2 -->
    <rect x="28"  y="148" width="56" height="44" rx="6" fill="#ffffff" stroke="#e7dfd0"/>
    <rect x="88"  y="148" width="56" height="44" rx="6" fill="#a6e3a1"/>
    <rect x="148" y="148" width="56" height="44" rx="6" fill="#a6e3a1"/>
    <rect x="208" y="148" width="56" height="44" rx="6" fill="#ffffff" stroke="#e7dfd0"/>
    <rect x="268" y="148" width="56" height="44" rx="6" fill="#f9e2af"/>
    <rect x="328" y="148" width="56" height="44" rx="6" fill="#f9e2af"/>
    <rect x="388" y="148" width="56" height="44" rx="6" fill="#f9e2af"/>
    <!-- Row 3 -->
    <rect x="28"  y="196" width="56" height="44" rx="6" fill="#3b82f6"/>
    <rect x="88"  y="196" width="56" height="44" rx="6" fill="#3b82f6"/>
    <rect x="148" y="196" width="56" height="44" rx="6" fill="#ffffff" stroke="#e7dfd0"/>
    <rect x="208" y="196" width="56" height="44" rx="6" fill="#ffffff" stroke="#e7dfd0"/>
    <rect x="268" y="196" width="56" height="44" rx="6" fill="#a6e3a1"/>
    <rect x="328" y="196" width="56" height="44" rx="6" fill="#a6e3a1"/>
    <rect x="388" y="196" width="56" height="44" rx="6" fill="#a6e3a1"/>
    <!-- Row 4 -->
    <rect x="28"  y="244" width="56" height="44" rx="6" fill="#ffffff" stroke="#e7dfd0"/>
    <rect x="88"  y="244" width="56" height="44" rx="6" fill="#3b82f6"/>
    <rect x="148" y="244" width="56" height="44" rx="6" fill="#3b82f6"/>
    <rect x="208" y="244" width="56" height="44" rx="6" fill="#3b82f6"/>
    <rect x="268" y="244" width="56" height="44" rx="6" fill="#3b82f6"/>
    <rect x="328" y="244" width="56" height="44" rx="6" fill="#ffffff" stroke="#e7dfd0"/>
    <rect x="388" y="244" width="56" height="44" rx="6" fill="#ffffff" stroke="#e7dfd0"/>
  </g>

  <!-- Day numbers -->
  <g font-family="ui-sans-serif" font-size="10" font-weight="700">
    <text x="42" y="120" fill="#14120f">3</text>    <text x="102" y="120" fill="#14120f">4</text>
    <text x="162" y="120" fill="#ffffff">5</text>   <text x="222" y="120" fill="#ffffff">6</text>
    <text x="282" y="120" fill="#ffffff">7</text>   <text x="342" y="120" fill="#14120f">8</text>
    <text x="402" y="120" fill="#14120f">9</text>

    <text x="42" y="168" fill="#14120f">10</text>   <text x="102" y="168" fill="#14120f">11</text>
    <text x="162" y="168" fill="#14120f">12</text>  <text x="222" y="168" fill="#14120f">13</text>
    <text x="282" y="168" fill="#14120f">14</text>  <text x="342" y="168" fill="#14120f">15</text>
    <text x="402" y="168" fill="#14120f">16</text>

    <text x="42" y="216" fill="#ffffff">17</text>   <text x="102" y="216" fill="#ffffff">18</text>
    <text x="162" y="216" fill="#14120f">19</text>  <text x="222" y="216" fill="#14120f">20</text>
    <text x="282" y="216" fill="#14120f">21</text>  <text x="342" y="216" fill="#14120f">22</text>
    <text x="402" y="216" fill="#14120f">23</text>

    <text x="42" y="264" fill="#14120f">24</text>   <text x="102" y="264" fill="#ffffff">25</text>
    <text x="162" y="264" fill="#ffffff">26</text>  <text x="222" y="264" fill="#ffffff">27</text>
    <text x="282" y="264" fill="#ffffff">28</text>  <text x="342" y="264" fill="#14120f">29</text>
    <text x="402" y="264" fill="#14120f">30</text>
  </g>

  <!-- Legend -->
  <g font-family="ui-sans-serif" font-size="8" fill="#57534e">
    <rect x="28" y="304" width="8" height="8" rx="2" fill="#3b82f6"/>
    <text x="42" y="311">Airbnb</text>
    <rect x="90" y="304" width="8" height="8" rx="2" fill="#a6e3a1"/>
    <text x="104" y="311">Booking</text>
    <rect x="158" y="304" width="8" height="8" rx="2" fill="#f9e2af"/>
    <text x="172" y="311">Direct</text>
  </g>
</svg>
