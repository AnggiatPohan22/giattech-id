<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 320" preserveAspectRatio="xMidYMid slice">
  <rect width="480" height="320" fill="#e5e0d1"/>

  <!-- Browser chrome -->
  <rect width="480" height="32" fill="#f5f1e6"/>
  <circle cx="16" cy="16" r="5" fill="#dc2626"/>
  <circle cx="32" cy="16" r="5" fill="#f59e0b"/>
  <circle cx="48" cy="16" r="5" fill="#16a34a"/>
  <rect x="72" y="8" width="360" height="16" rx="8" fill="#e7dfd0"/>
  <text x="252" y="19" font-family="ui-sans-serif" font-size="9" fill="#78716c" text-anchor="middle">https://villa-anantara-bali.com</text>

  <!-- Page nav -->
  <g font-family="ui-sans-serif" font-size="8" fill="#14120f">
    <text x="20" y="54" font-weight="800">VILLA ANANTARA</text>
    <text x="290" y="54">STAYS</text>
    <text x="325" y="54">EXPERIENCES</text>
    <text x="386" y="54">JOURNAL</text>
    <rect x="430" y="46" width="34" height="12" rx="6" fill="#0f172a"/>
    <text x="447" y="55" fill="#ffffff" text-anchor="middle" font-weight="700">Book</text>
  </g>

  <!-- Hero image area -->
  <rect x="20" y="68" width="440" height="180" rx="12" fill="#78716c"/>
  <!-- Water shimmer stripes -->
  <g opacity="0.35">
    <rect x="20" y="180" width="440" height="68" fill="url(#gradWater)"/>
  </g>
  <defs>
    <linearGradient id="gradWater" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0891b2" stop-opacity="0.2"/>
      <stop offset="1" stop-color="#0e7490" stop-opacity="0.9"/>
    </linearGradient>
  </defs>
  <!-- Sun -->
  <circle cx="380" cy="120" r="26" fill="#fbbf24" opacity="0.85"/>
  <!-- Palm silhouettes -->
  <path d="M60 248 Q56 210 66 190 Q60 200 78 194 Q68 190 76 178 Q74 190 90 188 Q82 178 92 168" stroke="#14120f" stroke-width="3" fill="none" opacity="0.6"/>
  <path d="M420 248 Q416 220 424 202 Q420 208 434 204 Q428 200 434 190 Q432 200 444 198 Q438 190 446 182" stroke="#14120f" stroke-width="3" fill="none" opacity="0.5"/>

  <!-- Headline overlay on hero -->
  <text x="40" y="110" font-family="ui-sans-serif" font-size="20" font-weight="800" fill="#ffffff" opacity="0.95">Private Villas.</text>
  <text x="40" y="132" font-family="ui-sans-serif" font-size="20" font-weight="800" fill="#ffffff" opacity="0.95">Direct Booking.</text>
  <rect x="40" y="150" width="90" height="20" rx="10" fill="#ffffff"/>
  <text x="85" y="164" font-family="ui-sans-serif" font-size="9" font-weight="700" fill="#14120f" text-anchor="middle">Check Availability</text>

  <!-- Below-fold cards -->
  <g>
    <rect x="20" y="264" width="140" height="44" rx="8" fill="#ffffff"/>
    <rect x="30" y="272" width="60" height="6" rx="2" fill="#3b82f6"/>
    <rect x="30" y="284" width="120" height="4" rx="2" fill="#78716c"/>
    <rect x="30" y="292" width="100" height="4" rx="2" fill="#78716c"/>

    <rect x="170" y="264" width="140" height="44" rx="8" fill="#ffffff"/>
    <rect x="180" y="272" width="70" height="6" rx="2" fill="#3b82f6"/>
    <rect x="180" y="284" width="120" height="4" rx="2" fill="#78716c"/>
    <rect x="180" y="292" width="90" height="4" rx="2" fill="#78716c"/>

    <rect x="320" y="264" width="140" height="44" rx="8" fill="#ffffff"/>
    <rect x="330" y="272" width="80" height="6" rx="2" fill="#3b82f6"/>
    <rect x="330" y="284" width="120" height="4" rx="2" fill="#78716c"/>
    <rect x="330" y="292" width="110" height="4" rx="2" fill="#78716c"/>
  </g>
</svg>
