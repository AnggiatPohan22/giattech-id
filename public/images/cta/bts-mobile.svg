<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 320" preserveAspectRatio="xMidYMid slice">
  <!-- Backdrop -->
  <defs>
    <linearGradient id="ph-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1e293b"/>
      <stop offset="1" stop-color="#0f172a"/>
    </linearGradient>
  </defs>
  <rect width="480" height="320" fill="url(#ph-bg)"/>

  <!-- Soft glow -->
  <circle cx="240" cy="160" r="120" fill="#3b82f6" opacity="0.18"/>
  <circle cx="120" cy="80"  r="80"  fill="#a855f7" opacity="0.12"/>
  <circle cx="380" cy="240" r="90"  fill="#22d3ee" opacity="0.10"/>

  <!-- Phone frame — 180×280 centered -->
  <g transform="translate(150 20)">
    <rect x="0" y="0" width="180" height="280" rx="26" fill="#0a0a0a"/>
    <rect x="6" y="6" width="168" height="268" rx="20" fill="#f8fafc"/>
    <!-- Notch -->
    <rect x="72" y="10" width="36" height="7" rx="3.5" fill="#0a0a0a"/>

    <!-- Status bar -->
    <text x="20" y="34" font-family="ui-sans-serif" font-size="8" fill="#14120f" font-weight="700">9:41</text>
    <g transform="translate(140 27)" fill="#14120f">
      <rect x="0" y="0" width="12" height="6" rx="1"/>
      <rect x="14" y="0" width="6" height="6" rx="1"/>
      <rect x="22" y="1" width="10" height="4" rx="1" opacity="0.4"/>
    </g>

    <!-- Header -->
    <text x="20" y="60" font-family="ui-sans-serif" font-size="10" font-weight="800" fill="#14120f">GIATTECH</text>
    <text x="160" y="60" font-family="ui-sans-serif" font-size="12" fill="#14120f" text-anchor="end">☰</text>

    <!-- Hero card -->
    <rect x="14" y="72" width="152" height="90" rx="12" fill="#3b82f6"/>
    <text x="26" y="94" font-family="ui-sans-serif" font-size="10" fill="#ffffff" opacity="0.8">Welcome back,</text>
    <text x="26" y="112" font-family="ui-sans-serif" font-size="16" fill="#ffffff" font-weight="800">Anggiat</text>
    <rect x="26" y="126" width="70" height="18" rx="9" fill="#ffffff"/>
    <text x="61" y="139" font-family="ui-sans-serif" font-size="8" font-weight="700" fill="#3b82f6" text-anchor="middle">View Stats</text>

    <!-- Quick actions -->
    <g>
      <rect x="14" y="172" width="72" height="52" rx="10" fill="#f1f5f9"/>
      <circle cx="30" cy="188" r="6" fill="#3b82f6"/>
      <rect x="24" y="200" width="44" height="4" rx="2" fill="#0f172a"/>
      <rect x="24" y="208" width="36" height="3" rx="1.5" fill="#78716c"/>

      <rect x="94" y="172" width="72" height="52" rx="10" fill="#f1f5f9"/>
      <circle cx="110" cy="188" r="6" fill="#a855f7"/>
      <rect x="104" y="200" width="44" height="4" rx="2" fill="#0f172a"/>
      <rect x="104" y="208" width="52" height="3" rx="1.5" fill="#78716c"/>
    </g>

    <!-- List rows -->
    <g>
      <rect x="14" y="234" width="152" height="14" rx="4" fill="#f1f5f9"/>
      <circle cx="24" cy="241" r="3" fill="#16a34a"/>
      <rect x="32" y="238.5" width="90" height="5" rx="1" fill="#14120f"/>
      <rect x="14" y="252" width="152" height="14" rx="4" fill="#f1f5f9"/>
      <circle cx="24" cy="259" r="3" fill="#f59e0b"/>
      <rect x="32" y="256.5" width="70" height="5" rx="1" fill="#14120f"/>
    </g>
  </g>

  <!-- Little accent labels floating around -->
  <g font-family="ui-sans-serif" font-size="9" font-weight="700">
    <rect x="40"  y="60"  width="66" height="20" rx="10" fill="#ffffff"/>
    <text x="73"  y="74"  fill="#0f172a" text-anchor="middle">React Native</text>

    <rect x="360" y="260" width="72" height="20" rx="10" fill="#3b82f6"/>
    <text x="396" y="274" fill="#ffffff" text-anchor="middle">Live · 60 fps</text>
  </g>
</svg>
