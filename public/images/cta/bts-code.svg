    <text x="76" y="234" fill="#a6e3a1">'check_in'</text><text x="122" y="234" fill="#cdd6f4"> =&gt; </text><text x="146" y="234" fill="#a6e3a1">'required|date'</text><text x="220" y="234" fill="#cdd6f4">,</text>
