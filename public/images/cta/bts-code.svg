    <text x="40" y="150" fill="#cba6f7">class</text><text x="72" y="150" fill="#89b4fa"> BookingController</text><text x="176" y="150" fill="#cba6f7"> extends</text><text x="221" y="150" fill="#89b4fa"> Controller</text>
    <text x="40" y="164" fill="#cdd6f4">{</text>
    <text x="52" y="178" fill="#cba6f7">public function</text><text x="132" y="178" fill="#89dceb"> store</text><text x="164" y="178" fill="#cdd6f4">(</text><text x="170" y="178" fill="#89b4fa">Request</text><text x="209" y="178" fill="#cdd6f4"> $request)</text>
    <text x="52" y="192" fill="#cdd6f4">{</text>
    <text x="64" y="206" fill="#cdd6f4">$data = $request-&gt;</text><text x="165" y="206" fill="#89dceb">validate</text><text x="206" y="206" fill="#cdd6f4">([</text>
